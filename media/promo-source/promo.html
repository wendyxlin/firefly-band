<!doctype html>
<html><head><meta charset="utf-8">
<style>
@font-face{font-family:Outfit;font-weight:600;src:url(fonts/outfit-latin-600-normal.woff2)}
@font-face{font-family:Outfit;font-weight:700;src:url(fonts/outfit-latin-700-normal.woff2)}
@font-face{font-family:Plex;font-weight:400;src:url(fonts/ibm-plex-sans-latin-400-normal.woff2)}
@font-face{font-family:Plex;font-weight:500;src:url(fonts/ibm-plex-sans-latin-500-normal.woff2)}
@font-face{font-family:Plex;font-weight:600;src:url(fonts/ibm-plex-sans-latin-600-normal.woff2)}

canvas{display:block}
</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W=1920,H=1080, c=document.getElementById('c').getContext('2d');
const BG='#0e0d16', FG='#efecf6', MUTED='#9a95ad', AMBER='#f5b544', GOLD='#e2b65a', RED='#ef5b6b', GREEN='#5ed39a', BLUE='#6fa8ff', VIOLET='#c9a0ff';
const DUR=66;
// Scene start times
const T={dies:0, crowd:4.5, reveal:9, find:15, safety:21, checkin:26, home:32, mesh:39, app:45, inside:51, privacy:56, cta:60};
// ---------- assets ----------
const IM={}; function load(name,src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>{IM[name]=i;r();}; i.onerror=()=>r(); i.src=src; }); }
const pad=(n)=>String(n).padStart(3,'0');
async function loadAll(){ const ps=[]; const F='frames_bangle/';
  for(let i=0;i<96;i++) ps.push(load('turn'+i,`${F}turn_${pad(i)}.png`));
  for(let i=0;i<48;i++) ps.push(load('expl'+i,`${F}expl_${pad(i)}.png`));
  for(let i=0;i<24;i++) ps.push(load('sos'+i,`${F}sos_${pad(i)}.png`));
  for(let i=0;i<32;i++) ps.push(load('find'+i,`${F}find_${pad(i)}.png`));
  for(let i=0;i<24;i++) ps.push(load('ok'+i,`${F}ok_${pad(i)}.png`));
  ps.push(load('hero','../renders/firefly-product-champagne.png'));
  ps.push(document.fonts.load('700 40px Outfit'),document.fonts.load('600 40px Outfit'),document.fonts.load('400 20px Plex'),document.fonts.load('500 20px Plex'),document.fonts.load('600 20px Plex'),document.fonts.load('500 20px Mono'));
  await Promise.all(ps); }
// ---------- helpers ----------
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const eout=x=>1-Math.pow(1-clamp(x),3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function fadeIO(t,a,b,f=0.5){ return Math.min(seg(t,a,a+f), 1-seg(t,b-f,b)); }
function rand(i){ const x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function text(str,x,y,{size=64,weight=700,font='Outfit',color=FG,align='left',alpha=1,spacing=0,base='alphabetic'}={}){ c.save(); c.globalAlpha*=alpha; c.fillStyle=color; c.font=`${weight} ${size}px ${font}`; c.textAlign=align; c.textBaseline=base; if(spacing){ c.letterSpacing=spacing+'px'; } c.fillText(str,x,y); c.restore(); }
function wrap(str,x,y,maxW,lh,opts){ c.save(); c.font=`${opts.weight||400} ${opts.size||36}px ${opts.font||'Plex'}`; const words=str.split(' '); let line='', yy=y; for(const w of words){ const test=line?line+' '+w:w; if(c.measureText(test).width>maxW && line){ text(line,x,yy,opts); line=w; yy+=lh; } else line=test; } if(line) text(line,x,yy,opts); c.restore(); return yy; }
function rise(t,a,dur=0.7){ return {alpha:eout(seg(t,a,a+dur)), dy:(1-eout(seg(t,a,a+dur)))*30}; }
function eyebrow(str,x,y,alpha,color=AMBER){ text(str.toUpperCase(),x,y,{size:24,weight:500,font:'Mono',color,alpha,spacing:4}); }
function glow(x,y,r,color,a){ const g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,color); g.addColorStop(1,'rgba(0,0,0,0)'); c.save(); c.globalAlpha*=a; c.fillStyle=g; c.fillRect(x-r,y-r,2*r,2*r); c.restore(); }
function img(name,x,y,w,h,alpha=1){ const i=IM[name]; if(!i) return; c.save(); c.globalAlpha*=alpha; c.drawImage(i,x,y,w,h); c.restore(); }
function rr(x,y,w,h,r){ c.beginPath(); c.roundRect(x,y,w,h,r); }
function check(x,y,s,color,alpha){ c.save(); c.globalAlpha*=alpha; c.strokeStyle=color; c.lineWidth=s*0.16; c.lineCap='round'; c.lineJoin='round'; c.beginPath(); c.moveTo(x-s*0.32,y); c.lineTo(x-s*0.08,y+s*0.24); c.lineTo(x+s*0.36,y-s*0.26); c.stroke(); c.restore(); }
function vignette(){ const g=c.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.95); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.55)'); c.fillStyle=g; c.fillRect(0,0,W,H); }
function progressBar(t){ c.fillStyle='rgba(255,255,255,0.08)'; c.fillRect(0,H-4,W,4); c.fillStyle=AMBER; c.fillRect(0,H-4,W*t/DUR,4); }
function phoneFrame(){ c.fillStyle='#000'; rr(-10,-10,440,900,64); c.fill(); c.fillStyle='#0e0d16'; rr(0,0,420,880,56); c.fill(); c.fillStyle='#000'; rr(150,14,120,34,17); c.fill(); }

// ---------- scenes ----------
function s1(t){ // phone dies
  const a=fadeIO(t,0,4.5,0.4);
  c.globalAlpha=a;
  const r=rise(t,0.2); text('1:47 AM',W/2,420+r.dy,{size:150,align:'center',alpha:r.alpha});
  const pct=Math.max(0,Math.round(12-12*seg(t,1.0,3.2))); const bx=W/2-110, by=520;
  c.save(); c.globalAlpha*=eout(seg(t,0.8,1.3)); c.strokeStyle=FG; c.lineWidth=6; rr(bx,by,200,90,16); c.stroke(); c.fillStyle=FG; rr(bx+204,by+28,14,34,4); c.fill();
  c.fillStyle=pct<=5?RED:FG; rr(bx+12,by+12,176*pct/100+0.01,66,8); c.fill(); c.restore();
  text(pct+'%',W/2,700,{size:56,weight:600,align:'center',color:pct<=5?RED:FG,alpha:eout(seg(t,0.8,1.3))});
  const r2=rise(t,3.0); text('Your phone just died.',W/2,800+r2.dy,{size:52,weight:500,font:'Plex',align:'center',color:MUTED,alpha:r2.alpha});
  c.globalAlpha=1;
}
function crowd(t,sep,alpha){
  c.save(); c.globalAlpha=alpha;
  for(let i=0;i<220;i++){ const x=(rand(i)*W*1.1 - 60 + Math.sin(t*0.6+i)*14); const y=(rand(i+500)*H*0.9+60+Math.cos(t*0.5+i*1.3)*10); c.fillStyle=`rgba(154,149,173,${0.15+0.25*rand(i+9)})`; c.beginPath(); c.arc(x,y,6+rand(i+3)*5,0,Math.PI*2); c.fill(); }
  const you={x:W*0.5,y:H*0.55}; const fr=[[VIOLET,-1,-0.6],[BLUE,1.1,-0.2],[GREEN,-0.4,1]];
  fr.forEach(([col,dx,dy])=>{ const x=you.x+dx*(60+sep*520), y=you.y+dy*(40+sep*300); glow(x,y,70,col,0.35); c.fillStyle=col; c.beginPath(); c.arc(x,y,13,0,Math.PI*2); c.fill(); });
  glow(you.x,you.y,90,AMBER,0.5); c.fillStyle=AMBER; c.beginPath(); c.arc(you.x,you.y,16,0,Math.PI*2); c.fill();
  text('you',you.x+26,you.y+8,{size:28,weight:500,font:'Mono',color:AMBER});
  c.restore(); }
function s2(t){ // lost in the crowd
  const a=fadeIO(t,4.5,9.2,0.5); const sep=ease(seg(t,4.7,7.2));
  crowd(t,sep,a);
  c.save(); c.globalAlpha=a; c.fillStyle='rgba(14,13,22,0.55)'; c.fillRect(0,0,W,210); c.restore();
  const r=rise(t,5.0); text('Your friends are somewhere in here.',W/2,130+r.dy,{size:68,align:'center',alpha:r.alpha*a});
  const r2=rise(t,7.0); text('No battery.  No signal.  No idea where.',W/2,H-90+r2.dy,{size:44,weight:500,font:'Plex',align:'center',color:MUTED,alpha:r2.alpha*a});
}
function s3(t){ // reveal: the gold bangle
  const T0=T.reveal, T1=T.find+0.2; const a=fadeIO(t,T0,T1,0.6); if(a<=0) return; const p=seg(t,T0,T1);
  const k=Math.floor(p*95.99); const zoom=1+0.05*p;
  c.save(); c.globalAlpha=a; c.translate(W/2+300,H/2); c.scale(zoom,zoom); c.translate(-W/2,-H/2); img('turn'+k,0,0,W,H); c.restore();
  const g=c.createLinearGradient(0,0,W*0.5,0); g.addColorStop(0,'rgba(14,13,22,0.85)'); g.addColorStop(1,'rgba(14,13,22,0)'); c.save(); c.globalAlpha=a; c.fillStyle=g; c.fillRect(0,0,W*0.5,H); c.restore();
  const fl=t>=T0?1-seg(t,T0,T0+0.6):0; if(fl>0){ c.save(); c.globalAlpha=fl*0.55; c.fillStyle=AMBER; c.fillRect(0,0,W,H); c.restore(); }
  const r=rise(t,T0+0.6,0.9); eyebrow('Introducing',140,190+r.dy,r.alpha*a);
  text('Firefly',140,320+r.dy,{size:150,alpha:r.alpha*a});
  const r2=rise(t,T0+1.6); wrap('The gold bangle that finds your friends when your phone can\'t.',140,410+r2.dy,600,58,{size:44,weight:500,font:'Plex',color:FG,alpha:r2.alpha*a});
  const r3=rise(t,T0+3.0); text('Stepped cushion  ·  halo of white stones  ·  firefly wings',140,H-120+r3.dy,{size:30,weight:500,font:'Mono',color:MUTED,alpha:r3.alpha*a});
}
function featureLayout(t,a,frameName,count,t0,t1,eye,title,body,extra,eyeColor){
  const p=seg(t,t0,t1); const k=Math.min(count-1,Math.floor(p*count));
  c.save(); c.globalAlpha=a; img(frameName+k,-260,0,W,H); c.restore();
  const g=c.createLinearGradient(W*0.48,0,W*0.62,0); g.addColorStop(0,'rgba(14,13,22,0)'); g.addColorStop(1,'rgba(14,13,22,0.92)'); c.save(); c.globalAlpha=a; c.fillStyle=g; c.fillRect(W*0.48,0,W*0.52,H); c.fillStyle='rgba(14,13,22,0.92)'; c.fillRect(W*0.62,0,W*0.38,H); c.restore();
  const x=W*0.6; const r=rise(t,t0+0.3); eyebrow(eye,x,280+r.dy,r.alpha*a,eyeColor||AMBER);
  text(title,x,380+r.dy,{size:84,alpha:r.alpha*a});
  const r2=rise(t,t0+0.9); wrap(body,x,460+r2.dy,660,56,{size:40,weight:400,font:'Plex',color:MUTED,alpha:r2.alpha*a});
  if(extra) extra(x);
}
function s4(t){ // find
  const T0=T.find, T1=T.safety+0.2; const a=fadeIO(t,T0,T1,0.5); if(a<=0) return;
  featureLayout(t,a,'find',32,T0,T1,'Button 1 · Find','Hot or cold.','Press the plain gold wing and the stone pulses faster as you get closer. Four lights means they\'re right next to you.',x=>{
    const r=rise(t,T0+2.5); const n=1+Math.floor(seg(t,T0+2.6,T0+5.4)*3.99); for(let i=0;i<4;i++){ c.save(); c.globalAlpha=a*r.alpha; c.fillStyle=i<n?AMBER:'#2b2a38'; c.beginPath(); c.arc(x+20+i*56,800+r.dy,18,0,Math.PI*2); c.fill(); if(i<n) glow(x+20+i*56,800+r.dy,50,AMBER,0.35*a); c.restore(); }
    text(['far','closer','close','right here'][n-1],x+250,812+r.dy,{size:34,weight:500,font:'Mono',color:FG,alpha:a*r.alpha});
    text('2× come find me  ·  3× I\'m home  ·  hold I\'m okay',x,900+r.dy,{size:24,weight:500,font:'Mono',color:MUTED,alpha:a*r.alpha});
  });
}
function s5(t){ // safety
  const T0=T.safety, T1=T.checkin+0.2; const a=fadeIO(t,T0,T1,0.5); if(a<=0) return;
  featureLayout(t,a,'sos',24,T0,T1,'Button 2 · Safety','Help, quietly.','Tap the jeweled wing for a discreet "I need help" to the friends you choose. Hold 3 seconds for an SOS to the whole group.',x=>{
    const r=rise(t,T0+2.0); const hold=seg(t,T0+2.4,T0+4.4); c.save(); c.globalAlpha=a*r.alpha; c.strokeStyle='#2b2a38'; c.lineWidth=10; c.beginPath(); c.arc(x+60,820+r.dy,46,0,Math.PI*2); c.stroke(); c.strokeStyle=hold>=1?RED:AMBER; c.beginPath(); c.arc(x+60,820+r.dy,46,-Math.PI/2,-Math.PI/2+hold*Math.PI*2); c.stroke(); c.restore();
    text(hold>=1?'SOS sent':(hold*3).toFixed(1)+' s',x+140,832+r.dy,{size:40,weight:600,color:hold>=1?RED:FG,alpha:a*r.alpha});
    text('2×  cancel an accident',x,930+r.dy,{size:28,weight:500,font:'Mono',color:MUTED,alpha:a*r.alpha});
  });
}
function s6(t){ // NEW: "I'm okay" check-in
  const T0=T.checkin, T1=T.home+0.2; const a=fadeIO(t,T0,T1,0.5); if(a<=0) return;
  featureLayout(t,a,'ok',24,T0,T1,'Check-ins · hold Button 1','"I\'m okay."','Hold the plain wing and your whole group gets a check-in. No phone, no typing. The stone glows green when it\'s delivered.',x=>{
    const sent=T0+2.0; const r=rise(t,sent-0.3);
    const friends=[['Maya',VIOLET],['Jordan',GREEN],['Sam',BLUE]];
    text('Your check-in reached',x,780+r.dy,{size:28,weight:500,font:'Mono',color:MUTED,alpha:a*r.alpha});
    friends.forEach(([n,col],i)=>{ const ti=sent+0.6+i*0.55; const on=eout(seg(t,ti,ti+0.35)); const xx=x+i*240, yy=850+r.dy;
      c.save(); c.globalAlpha=a*r.alpha; c.fillStyle='#17161f'; rr(xx,yy-38,226,64,32); c.fill(); c.fillStyle=col; c.beginPath(); c.arc(xx+32,yy-6,12,0,Math.PI*2); c.fill(); c.restore();
      text(n,xx+56,yy+4,{size:28,weight:600,font:'Plex',alpha:a*r.alpha});
      if(on>0){ glow(xx+190,yy-6,34,GREEN,0.5*a*on); check(xx+190,yy-6,30,GREEN,a*on); }
    });
    const r2=rise(t,sent+2.6); text('Missed one? The organizer\'s app nudges them.',x,940+r2.dy,{size:28,weight:500,font:'Mono',color:MUTED,alpha:a*r2.alpha});
  },GREEN);
}
function rollPhone(x,y,s,t,a){ // organizer's Home-safe roll call screen
  const T0=T.home; const nudge=T0+3.4, samHome=T0+5.0;
  c.save(); c.globalAlpha=a; c.translate(x,y); c.scale(s,s); phoneFrame();
  text('2:11',40,44,{size:22,weight:600,font:'Plex'});
  text('Home safe',28,118,{size:40,weight:700});
  const done=t>=samHome; const n= done?4:3;
  text(done?'Everyone\'s home.':`${n} of 4 confirmed`,30,160,{size:24,weight:500,font:'Plex',color:done?GREEN:MUTED});
  // progress
  c.fillStyle='#22212e'; rr(28,182,364,12,6); c.fill(); c.fillStyle=done?GREEN:AMBER; rr(28,182,364*(0.75+0.25*eout(seg(t,samHome,samHome+0.6))),12,6); c.fill();
  const rows=[['Maya','You · organizer','Home 1:52 AM',VIOLET,true,T0+0.6],['Priya','','Home 2:04 AM',VIOLET,true,T0+1.0],['Jordan','','In a ride 1:58 AM',GREEN,true,T0+1.4],['Sam','','',BLUE,false,0]];
  rows.forEach(([nm,sub,st,col,ok,ti],i)=>{ const yy=226+i*118; const vis=ok?eout(seg(t,ti,ti+0.4)):1;
    c.fillStyle='#17161f'; rr(20,yy,380,100,22); c.fill();
    c.fillStyle=col; c.beginPath(); c.arc(64,yy+50,22,0,Math.PI*2); c.fill(); text(nm[0],64,yy+59,{size:24,weight:700,color:'#140f1f',align:'center'});
    text(nm,102,yy+44,{size:26,weight:600,font:'Plex'});
    if(ok){ text(st,102,yy+78,{size:20,weight:500,font:'Plex',color:GREEN,alpha:vis}); check(360,yy+50,34,GREEN,vis); }
    else { const home=t>=samHome; const nudged=t>=nudge;
      if(home){ const v=eout(seg(t,samHome,samHome+0.4)); text('Home 2:11 AM',102,yy+78,{size:20,weight:500,font:'Plex',color:GREEN,alpha:v}); glow(360,yy+50,40,GREEN,0.5*v); check(360,yy+50,34,GREEN,v); }
      else { text(nudged?'Not yet · nudge sent':'Not yet',102,yy+78,{size:20,weight:500,font:'Plex',color:AMBER}); c.save(); c.strokeStyle=AMBER; c.lineWidth=4; c.beginPath(); c.arc(360,yy+50,15,0,Math.PI*2); c.stroke(); c.restore(); if(nudged){ const rip=((t-nudge)*1.2)%1; c.save(); c.globalAlpha*=1-rip; c.strokeStyle=AMBER; c.lineWidth=3; c.beginPath(); c.arc(360,yy+50,15+rip*28,0,Math.PI*2); c.stroke(); c.restore(); } }
    }
  });
  // nudge button
  const btnA = t>=samHome?0.35:1; c.save(); c.globalAlpha*=btnA; c.fillStyle=AMBER; rr(20,720,380,72,22); c.fill(); c.restore(); text('Nudge the group',210,766,{size:26,weight:700,color:'#1a1200',align:'center',alpha:btnA});
  text('Messages travel over the group\'s bands',210,836,{size:17,weight:500,font:'Plex',color:MUTED,align:'center'});
  c.restore(); }
function s7(t){ // NEW: home-safe roll call
  const T0=T.home, T1=T.mesh+0.2; const a=fadeIO(t,T0,T1,0.5); if(a<=0) return;
  const r=rise(t,T0+0.2); rollPhone(W*0.6,90+(1-eout(seg(t,T0,T0+0.9)))*80,1.02,t,a);
  eyebrow('End of the night',160,300+r.dy,r.alpha*a,GREEN);
  text('Nobody gets',160,410+r.dy,{size:96,alpha:r.alpha*a}); text('left behind.',160,520+r.dy,{size:96,alpha:r.alpha*a});
  const r2=rise(t,T0+1.0); wrap('Press the plain wing three times when you\'re home or in your ride. The organizer sees who\'s made it, and who hasn\'t yet.',160,620+r2.dy,760,56,{size:38,weight:400,font:'Plex',color:MUTED,alpha:r2.alpha*a});
  // triple-press indicator
  const r3=rise(t,T0+1.8); const ph=((t-T0-1.8)%1.6+1.6)%1.6;
  for(let i=0;i<3;i++){ const on = ph> i*0.22 && ph< i*0.22+0.18; c.save(); c.globalAlpha=a*r3.alpha; c.fillStyle=on?GOLD:'#2b2a38'; c.beginPath(); c.arc(180+i*54,850+r3.dy,17,0,Math.PI*2); c.fill(); if(on) glow(180+i*54,850+r3.dy,46,GOLD,0.45); c.restore(); }
  text('3×  I\'m home',350,862+r3.dy,{size:34,weight:500,font:'Mono',color:FG,alpha:a*r3.alpha});
  const r4=rise(t,T0+2.6); text('Out of range? It\'s sent the moment you reconnect.',160,940+r4.dy,{size:26,weight:500,font:'Mono',color:MUTED,alpha:a*r4.alpha});
}
function s8(t){ // mesh
  const T0=T.mesh, T1=T.app+0.2; const a=fadeIO(t,T0,T1,0.5); if(a<=0) return; c.save(); c.globalAlpha=a;
  c.strokeStyle='#2b2a38'; c.lineWidth=6; rr(160,260,900,560,18); c.stroke(); rr(1180,420,520,360,18); c.stroke();
  c.fillStyle='#17161f'; c.fillRect(1060,560,120,80);
  text('CLUB · basement, no signal',190,310,{size:26,weight:500,font:'Mono',color:MUTED}); text('PIZZA PLACE',1210,470,{size:26,weight:500,font:'Mono',color:MUTED});
  const nodes=[{x:380,y:470,col:AMBER,n:'You'},{x:820,y:640,col:VIOLET,n:'Priya'},{x:560,y:720,col:GREEN,n:'Jordan'},{x:1460,y:640,col:BLUE,n:'Sam'}];
  const links=[[0,1],[0,2],[1,3],[2,1]];
  links.forEach(([i,j],k)=>{ const A=nodes[i],B=nodes[j]; const on=seg(t,T0+0.6+k*0.35,T0+1.2+k*0.35); c.strokeStyle=`rgba(245,181,68,${0.5*on})`; c.lineWidth=3; c.setLineDash([10,10]); c.lineDashOffset=-t*40; c.beginPath(); c.moveTo(A.x,A.y); c.lineTo(A.x+(B.x-A.x)*on,A.y+(B.y-A.y)*on); c.stroke(); c.setLineDash([]);
    const pp=((t*0.8+k*0.37)%1); if(on>=1){ const x=A.x+(B.x-A.x)*pp, y=A.y+(B.y-A.y)*pp; glow(x,y,26,AMBER,0.8); } });
