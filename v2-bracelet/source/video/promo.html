<canvas id="c" width="1920" height="1080"></canvas>
<script>
// Firefly v2 (bracelet) promo: 68 s, 1920x1080, drawn frame by frame (renderAt(t)) so capture.py can export at an exact frame rate.
const W=1920,H=1080, c=document.getElementById('c').getContext('2d');
const BG='#141012', CARD='#241c1f', CARD2='#33282c', FG='#fbf1ee', MUTED='#c7b1b3', PINK='#f6c1c8', ACC='#f2a7b3', GOLD='#e2b65a', RED='#ff5d6e', GREEN='#7fe0ad', AMBER='#ffc070', SKY='#a9c8ff', PEACH='#ffc9a8', LAV='#d6b4ff';

const T={night:0, drift:5, reveal:10, find:16, come:22, home:28, who:34, sos:39, range:45, design:51, privacy:57, cta:61};

const IM={}; function load(name,src){ return new Promise(r=>{ const i=new Image(); i.onload=()=>{IM[name]=i;r();}; i.onerror=()=>r(); i.src=src; }); }
const pad=n=>String(n).padStart(3,'0');
const NF={find:72, come:58, home:48, sos:72, apart:54, turn:96};
async function loadAll(){ const ps=[];
  for(const [k,n] of Object.entries(NF)) for(let i=0;i<n;i++) ps.push(load(k+i,`frames/${k}_${pad(i)}.png`));
  for(const s of ['hero','buttons','rose','silver','black','find']) ps.push(load('st_'+s,`stills/v2-${s}.jpg`));
  ps.push(load('life','stills/life-nightout.jpg'), load('wrist','stills/life-wrist.jpg'));
  ps.push(document.fonts.load('500 40px Corm'),document.fonts.load('600 40px Corm'),document.fonts.load('italic 500 40px Corm'),document.fonts.load('italic 600 40px Corm'),document.fonts.load('400 20px Dm'),document.fonts.load('500 20px Dm'),document.fonts.load('600 20px Dm'),document.fonts.load('700 20px Dm'),document.fonts.load('500 20px Mono'));
  await Promise.all(ps); }
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const ease=x=>{x=clamp(x);return x<.5?4*x*x*x:1-Math.pow(-2*x+2,3)/2;};
const eout=x=>1-Math.pow(1-clamp(x),3);
const seg=(t,a,b)=>clamp((t-a)/(b-a));
function fadeIO(t,a,b,f=0.5){ return Math.min(seg(t,a,a+f), 1-seg(t,b-f,b)); }
function rand(i){ const x=Math.sin(i*127.1+311.7)*43758.5453; return x-Math.floor(x); }
function text(str,x,y,{size=64,weight=500,font='Corm',color=FG,align='left',alpha=1,spacing=0,italic=false}={}){ c.save(); c.globalAlpha*=alpha; c.fillStyle=color; c.font=`${italic?'italic ':''}${weight} ${size}px ${font}`; c.textAlign=align; c.textBaseline='alphabetic'; if(spacing) c.letterSpacing=spacing+'px'; c.fillText(str,x,y); c.restore(); }
function wrap(str,x,y,maxW,lh,opts){ c.save(); c.font=`${opts.weight||400} ${opts.size||36}px ${opts.font||'Dm'}`; const words=str.split(' '); let line='', yy=y; for(const w of words){ const test=line?line+' '+w:w; if(c.measureText(test).width>maxW && line){ text(line,x,yy,{font:'Dm',...opts}); line=w; yy+=lh; } else line=test; } if(line) text(line,x,yy,{font:'Dm',...opts}); c.restore(); return yy; }
function rise(t,a,dur=0.7){ return {alpha:eout(seg(t,a,a+dur)), dy:(1-eout(seg(t,a,a+dur)))*30}; }
function eyebrow(str,x,y,alpha,color=ACC,align='left'){ text(str.toUpperCase(),x,y,{size:24,weight:500,font:'Mono',color,alpha,spacing:5,align}); }
function glow(x,y,r,color,a){ const g=c.createRadialGradient(x,y,0,x,y,r); g.addColorStop(0,color); g.addColorStop(1,'rgba(0,0,0,0)'); c.save(); c.globalAlpha*=a; c.fillStyle=g; c.fillRect(x-r,y-r,2*r,2*r); c.restore(); }
function img(name,x,y,w,h,alpha=1){ const i=IM[name]; if(!i) return; c.save(); c.globalAlpha*=alpha; c.drawImage(i,x,y,w,h); c.restore(); }
function cover(name,cx,cy,zoom,alpha){ const i=IM[name]; if(!i) return; const s=Math.max(W/i.width,H/i.height)*zoom; c.save(); c.globalAlpha*=alpha; c.drawImage(i,cx-i.width*s/2,cy-i.height*s/2,i.width*s,i.height*s); c.restore(); }
function rr(x,y,w,h,r){ c.beginPath(); c.roundRect(x,y,w,h,r); }
function check(x,y,s,color,alpha){ c.save(); c.globalAlpha*=alpha; c.strokeStyle=color; c.lineWidth=s*0.16; c.lineCap='round'; c.lineJoin='round'; c.beginPath(); c.moveTo(x-s*0.32,y); c.lineTo(x-s*0.08,y+s*0.24); c.lineTo(x+s*0.36,y-s*0.26); c.stroke(); c.restore(); }
function avatar(x,y,r,name,col,alpha=1){ c.save(); c.globalAlpha*=alpha; c.fillStyle=col; c.beginPath(); c.arc(x,y,r,0,Math.PI*2); c.fill(); c.restore(); text(name[0],x,y+r*0.36,{size:r*1.0,weight:700,font:'Dm',color:'#2b1218',align:'center',alpha}); }
function vignette(){ const g=c.createRadialGradient(W/2,H/2,H*0.35,W/2,H/2,H*0.95); g.addColorStop(0,'rgba(0,0,0,0)'); g.addColorStop(1,'rgba(0,0,0,0.5)'); c.fillStyle=g; c.fillRect(0,0,W,H); }
function progressBar(t){ c.fillStyle='rgba(255,255,255,0.07)'; c.fillRect(0,H-4,W,4); c.fillStyle=PINK; c.fillRect(0,H-4,W*t/DUR,4); }
function sideShade(a,fromRight,strong){ c.save(); c.globalAlpha=a;
  if(fromRight){ const g=c.createLinearGradient(W*0.46,0,W*0.62,0); g.addColorStop(0,'rgba(20,16,18,0)'); g.addColorStop(1,'rgba(20,16,18,0.94)'); c.fillStyle=g; c.fillRect(W*0.46,0,W*0.54,H); c.fillStyle='rgba(20,16,18,0.94)'; c.fillRect(W*0.62,0,W*0.38,H); }
  else { const e=strong?W*0.62:W*0.5, s0=strong?W*0.34:0; const g=c.createLinearGradient(e,0,s0,0); g.addColorStop(0,'rgba(20,16,18,0)'); g.addColorStop(1,'rgba(20,16,18,0.95)'); c.fillStyle=g; c.fillRect(s0,0,e-s0,H); if(strong){ c.fillStyle='rgba(20,16,18,0.95)'; c.fillRect(0,0,s0,H); } }
  c.restore(); }
function phoneFrame(){ c.fillStyle='#000'; rr(-10,-10,440,900,64); c.fill(); c.fillStyle='#1b1719'; rr(0,0,420,880,56); c.fill(); c.fillStyle='#000'; rr(150,14,120,34,17); c.fill(); }
function phoneTop(time,title,eye){ text(time,40,44,{size:22,weight:600,font:'Dm'}); text(eye,28,104,{size:17,weight:500,font:'Mono',color:ACC,spacing:4}); text(title,28,150,{size:40,weight:700,font:'Dm'}); }

function s1(t){ // the group forms
  const a=fadeIO(t,0,T.drift+0.2,0.4); if(a<=0) return; c.save(); c.globalAlpha=a;
  cover('wrist',W/2,H*0.42,1.05+0.03*t,0.24); c.fillStyle='rgba(20,16,18,0.55)'; c.fillRect(0,0,W,H);
  const r=rise(t,0.2); eyebrow('Friday',W/2,300+r.dy,r.alpha,ACC,'center');
  text('11:02 PM',W/2,450+r.dy,{size:170,weight:600,align:'center',alpha:r.alpha});
  const cr=rise(t,1.2); c.save(); c.globalAlpha*=cr.alpha; c.fillStyle=CARD; rr(W/2-430,520+cr.dy,860,250,32); c.fill(); c.strokeStyle='#3e3337'; c.lineWidth=2; c.stroke(); c.restore();
  text("Girls' Night Out ✨",W/2-380,595+cr.dy,{size:44,weight:700,font:'Dm',alpha:cr.alpha});
  text('My Group · 20 m radius',W/2-380,640+cr.dy,{size:24,weight:500,font:'Mono',color:MUTED,alpha:cr.alpha});
  FRIENDS.forEach(([n,col],i)=>{ const ap=eout(seg(t,1.8+i*0.35,2.2+i*0.35)); const x=W/2-340+i*195, y=712+cr.dy; avatar(x,y,30,n,col,ap*cr.alpha); text(n,x+42,y+9,{size:26,weight:600,font:'Dm',alpha:ap*cr.alpha}); });
  const r2=rise(t,3.4); text("Four bracelets, one group. The night can start.",W/2,880+r2.dy,{size:42,weight:500,font:'Dm',align:'center',color:MUTED,alpha:r2.alpha});
  c.restore(); }
function s2(t){ // Sophia drifts
  const T0=T.drift, T1=T.reveal+0.2; const a=fadeIO(t,T0,T1,0.5); if(a<=0) return; c.save(); c.globalAlpha=a;
  for(let i=0;i<240;i++){ const x=(rand(i)*W*1.1-60+Math.sin(t*0.6+i)*14); const y=(rand(i+500)*H*0.86+90+Math.cos(t*0.5+i*1.3)*10); c.fillStyle=`rgba(199,177,179,${0.12+0.22*rand(i+9)})`; c.beginPath(); c.arc(x,y,6+rand(i+3)*5,0,Math.PI*2); c.fill(); }
  const cx=W*0.44, cy=H*0.56, R=230; const sep=ease(seg(t,T0+1.0,T0+3.2));
  c.save(); c.setLineDash([12,12]); c.lineDashOffset=-t*20; c.strokeStyle=PINK; c.globalAlpha*=0.7; c.lineWidth=3; c.beginPath(); c.arc(cx,cy,R,0,Math.PI*2); c.stroke(); c.restore();
  text('20 m',cx+R*0.72,cy-R*0.74,{size:26,weight:500,font:'Mono',color:PINK});
  const pos=[[-0.35,-0.25],[0.25,0.1],[-0.1,0.38],[0.38,-0.32]];
  FRIENDS.forEach(([n,col],i)=>{ let [dx,dy]=pos[i]; let x=cx+dx*R, y=cy+dy*R; if(n==='Sophia'){ x+=sep*520; y+=sep*60; } glow(x,y,70,col,0.35); avatar(x,y,20,n,col); text(n,x,y+50,{size:24,weight:600,font:'Dm',align:'center'}); });
  glow(cx,cy,90,PINK,0.45); c.fillStyle=PINK; c.beginPath(); c.arc(cx,cy,14,0,Math.PI*2); c.fill(); text('you',cx+24,cy+8,{size:26,weight:500,font:'Mono',color:PINK});
  const sx=cx+0.25*R+520, sy=cy+0.1*R+60, bat=eout(seg(t,T0+3.0,T0+3.5));
  c.save(); c.globalAlpha*=bat; c.fillStyle=CARD; rr(sx-110,sy-120,220,60,30); c.fill(); c.restore(); text('🔋 4%',sx,sy-80,{size:28,weight:600,font:'Dm',align:'center',color:RED,alpha:bat});
  c.fillStyle='rgba(20,16,18,0.6)'; c.fillRect(0,0,W,200);
  const r=rise(t,T0+0.3); text('Then the night happens.',W/2,135+r.dy,{size:84,italic:true,align:'center',alpha:r.alpha});
  const r2=rise(t,T0+3.4); text("Sophia's outside the radius. Her phone is almost dead.",W/2,H-80+r2.dy,{size:42,weight:500,font:'Dm',align:'center',color:MUTED,alpha:r2.alpha});
  c.restore(); }
function s3(t){ // reveal
  const T0=T.reveal, T1=T.find+0.2; const a=fadeIO(t,T0,T1,0.6); if(a<=0) return; const p=seg(t,T0,T1);
  const k=Math.floor(p*95.99); const zoom=1.06+0.05*p;
  c.save(); c.globalAlpha=a; c.translate(W/2+500,H/2); c.scale(zoom,zoom); c.translate(-W/2,-H/2); img('turn'+k,0,0,W,H); c.restore();
  sideShade(a,false,true);
  const fl=t>=T0?1-seg(t,T0,T0+0.7):0; if(fl>0){ c.save(); c.globalAlpha=fl*0.5; c.fillStyle=PINK; c.fillRect(0,0,W,H); c.restore(); }
  const r=rise(t,T0+0.6,0.9); eyebrow('Introducing',140,250+r.dy,r.alpha*a);
  text('Firefly',134,410+r.dy,{size:190,weight:600,italic:true,alpha:r.alpha*a});
  const r2=rise(t,T0+1.5); text('Stay connected.',140,505+r2.dy,{size:66,alpha:r2.alpha*a}); text('Go further together.',140,580+r2.dy,{size:66,italic:true,color:PINK,alpha:r2.alpha*a});
  const r3=rise(t,T0+2.6); wrap('A slim bracelet with two buttons and one tiny light. It works when your phones don\'t.',140,690+r3.dy,640,54,{size:38,weight:400,color:MUTED,alpha:r3.alpha*a});
}
function featureLayout(t,a,seq,t0,eye,title,body,extra,eyeColor,once){
  const n=NF[seq]; let k=Math.floor((t-t0)*24); k= once? Math.min(n-1,Math.max(0,k)) : ((k%n)+n)%n; const z=1+0.04*seg(t,t0,t0+6);
  c.save(); c.globalAlpha=a; c.translate(W*0.36,H/2); c.scale(z,z); c.translate(-W*0.36,-H/2); img(seq+k,-300,0,W,H); c.restore();
  sideShade(a,true);
  const x=W*0.585; const r=rise(t,t0+0.3); eyebrow(eye,x,250+r.dy,r.alpha*a,eyeColor||ACC);
  c.save(); c.font='600 104px Corm'; const tw=c.measureText(title).width; c.restore(); text(title,x,365+r.dy,{size:Math.min(104,104*740/tw),weight:600,alpha:r.alpha*a});
  const r2=rise(t,t0+0.9); const yEnd=wrap(body,x,450+r2.dy,700,54,{size:38,weight:400,color:MUTED,alpha:r2.alpha*a});
  if(extra) extra(x,yEnd);
}
function s4(t){ // Button 1 x1: find
  const T0=T.find, T1=T.come+0.2; const a=fadeIO(t,T0,T1,0.5); if(a<=0) return;
  featureLayout(t,a,'find',T0,'Button 1 · press once','Find your friends.','It buzzes, and the light pulses faster as you get closer. No screen to look at.',(x)=>{
    const r=rise(t,T0+1.8); const d=Math.max(3,Math.round(14-11*ease(seg(t,T0+2.0,T0+5.0))));
    text(d+' m',x,830+r.dy,{size:120,weight:600,color:PINK,alpha:a*r.alpha});
    text(d<=3?'Getting closer… 3 meters away':'Getting closer…',x+250,812+r.dy,{size:32,weight:500,font:'Dm',color:FG,alpha:a*r.alpha});
    const r3=rise(t,T0+3.0); text('Measured with ultra-wideband, bracelet to bracelet.',x,930+r3.dy,{size:26,weight:500,font:'Mono',color:MUTED,alpha:a*r3.alpha});
  });
}
function s5(t){ // Button 1 x2: come find me
  const T0=T.come, T1=T.home+0.2; const a=fadeIO(t,T0,T1,0.5); if(a<=0) return;
  featureLayout(t,a,'come',T0,'Button 1 · press twice','Come find me.','Lost the group? Two presses and everyone\'s bracelet buzzes twice. Their app shows how far you are.',(x)=>{
    const r=rise(t,T0+2.0); ['Emma','Olivia','Mia'].forEach((n,i)=>{ const col=FRIENDS.find(f=>f[0]===n)[1]; const ti=T0+2.4+i*0.3; const on=eout(seg(t,ti,ti+0.3)); const xx=x+i*230, yy=830+r.dy;
      c.save(); c.globalAlpha=a*r.alpha; c.fillStyle=CARD; rr(xx,yy-38,214,64,32); c.fill(); c.restore(); avatar(xx+32,yy-6,16,n,col,a*r.alpha); text(n,xx+58,yy+3,{size:26,weight:600,font:'Dm',alpha:a*r.alpha});
      if(on>0){ const sh=Math.sin(t*60)*2*(1-seg(t,ti+0.4,ti+1.0)); text('bzz bzz',xx+150+sh,yy+3,{size:20,weight:600,font:'Mono',color:AMBER,alpha:a*on}); } });
    const r2=rise(t,T0+3.6); text('"Sophia · come find me · 14 m"',x,950+r2.dy,{size:28,weight:500,font:'Mono',color:MUTED,alpha:a*r2.alpha});
  },AMBER);
}
function s6(t){ // Button 2: I'm home
  const T0=T.home, T1=T.who+0.2; const a=fadeIO(t,T0,T1,0.5); if(a<=0) return;
  featureLayout(t,a,'home',T0+0.6,"Button 2 · press once","I'm home.","Through the door? One press. The light turns green when your group has it.",(x)=>{
    const sent=T0+3.4; const r=rise(t,T0+2.4); const al=a*r.alpha;
    ['Emma','Olivia','Mia'].forEach((n,i)=>{ const col=FRIENDS.find(f=>f[0]===n)[1]; const ti=sent+i*0.55; const on=eout(seg(t,ti,ti+0.35)); const xx=x+i*230, yy=830+r.dy;
      c.save(); c.globalAlpha=al; c.fillStyle=CARD; rr(xx,yy-38,214,64,32); c.fill(); c.restore(); avatar(xx+32,yy-6,16,n,col,al); text(n,xx+58,yy+3,{size:26,weight:600,font:'Dm',alpha:al});
      if(on>0){ glow(xx+180,yy-6,32,GREEN,0.5*a*on); check(xx+180,yy-6,28,GREEN,a*on); } });
    const r2=rise(t,T0+4.4); text('Pressed by mistake? Press twice within 5 s.',x,950+r2.dy,{size:27,weight:500,font:'Mono',color:MUTED,alpha:a*r2.alpha});
  },GREEN,true);
}
function whoPhone(x,y,s,t,a){
  const T0=T.who; const nudge=T0+1.8, sophia=T0+3.4;
  c.save(); c.globalAlpha=a; c.translate(x,y); c.scale(s,s); phoneFrame();
  phoneTop('2:11',"Who's home?",'FIREFLY ✦');
  const done=t>=sophia; text(done?"Everyone's home.":'4 of 5 home',30,196,{size:24,weight:500,font:'Dm',color:done?GREEN:MUTED});
  c.fillStyle=CARD2; rr(28,216,364,12,6); c.fill(); c.fillStyle=done?GREEN:PINK; rr(28,216,364*(0.8+0.2*eout(seg(t,sophia,sophia+0.6))),12,6); c.fill();
  const rows=[['You','Home 1:52 AM',PINK],['Emma','Home 1:58 AM',PINK],['Olivia','Home 2:03 AM',PEACH],['Mia','Home 2:06 AM',SKY],['Sophia','',LAV]];
  rows.forEach(([nm,st,col],i)=>{ const yy=250+i*100; c.fillStyle=CARD; rr(20,yy,380,86,22); c.fill(); avatar(62,yy+43,22,nm,col); text(nm,100,yy+38,{size:24,weight:600,font:'Dm'});
    if(st){ const v=eout(seg(t,T0+0.3+i*0.2,T0+0.6+i*0.2)); text(st,100,yy+68,{size:18,weight:500,font:'Dm',color:GREEN,alpha:v}); check(360,yy+43,30,GREEN,v); }
    else if(t>=sophia){ const v=eout(seg(t,sophia,sophia+0.4)); text('Home 2:11 AM',100,yy+68,{size:18,weight:500,font:'Dm',color:GREEN,alpha:v}); glow(360,yy+43,40,GREEN,0.5*v); check(360,yy+43,30,GREEN,v); }
    else { const nd=t>=nudge; text(nd?'Pending · nudged':'Pending',100,yy+68,{size:18,weight:500,font:'Dm',color:PINK}); c.save(); c.strokeStyle=PINK; c.lineWidth=3; c.beginPath(); c.arc(360,yy+43,14,0,Math.PI*2); c.stroke(); c.restore(); if(nd){ const rip=((t-nudge)*1.2)%1; c.save(); c.globalAlpha*=1-rip; c.strokeStyle=PINK; c.lineWidth=3; c.beginPath(); c.arc(360,yy+43,14+rip*26,0,Math.PI*2); c.stroke(); c.restore(); } }
  });
  const bA=t>=sophia?0.35:1; c.save(); c.globalAlpha*=bA; c.fillStyle=PINK; rr(20,770,380,70,22); c.fill(); c.restore(); text('Nudge Sophia',210,815,{size:24,weight:700,font:'Dm',color:'#2b1218',align:'center',alpha:bA});
  c.restore(); }
function s7(t){ // who's home
  const T0=T.who, T1=T.sos+0.2; const a=fadeIO(t,T0,T1,0.5); if(a<=0) return;
  const r=rise(t,T0+0.2); whoPhone(W*0.6,90+(1-eout(seg(t,T0,T0+0.9)))*80,1.02,t,a);
  eyebrow('End of the night',160,330+r.dy,r.alpha*a,GREEN);
  text('Nobody has to text',160,445+r.dy,{size:92,weight:600,alpha:r.alpha*a}); text('"u home?" again.',160,545+r.dy,{size:92,italic:true,color:PINK,alpha:r.alpha*a});
  const r2=rise(t,T0+1.0); wrap('Every Button 2 press lands in Who\'s home. Still waiting on someone? One tap nudges their bracelet.',160,650+r2.dy,760,54,{size:38,weight:400,color:MUTED,alpha:r2.alpha*a});
}
function s8(t){ // hidden SOS
  const T0=T.sos, T1=T.range+0.2; const a=fadeIO(t,T0,T1,0.5); if(a<=0) return;
