<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond&family=DM+Sans&family=JetBrains+Mono">
<style>
:root{--cream:#f8f1ed;--cream2:#f2e6e0;--ink:#2a1f22;--muted:#7a6669;--rose:#b0566a;--pink:#f3c2c6;--night:#1a1215;--night2:#261a1e;--gold:#c99a55}
*{box-sizing:border-box;margin:0;padding:0}
body{background:#888}
.post{position:relative;overflow:hidden;font-family:"DM Sans",sans-serif;color:var(--ink);background:var(--cream)}
.p45{width:1080px;height:1350px}.p916{width:1080px;height:1920px}.p11{width:1080px;height:1080px}
.serif{font-family:"Cormorant Garamond",serif}
.mono{font-family:"JetBrains Mono",monospace;letter-spacing:.18em;text-transform:uppercase}
.dark{background:var(--night);color:#fbf1ee}
.pinkbg{background:var(--pink);color:#2b1218}
.brand{position:absolute;left:72px;bottom:60px;font:600 italic 46px "Cormorant Garamond",serif;display:flex;gap:12px;align-items:center}
.brand span{font-style:normal;font-size:30px;color:var(--rose)}
.dark .brand span{color:var(--pink)}
.tagr{position:absolute;right:72px;bottom:72px;font-size:24px;letter-spacing:.16em;text-transform:uppercase;font-family:"JetBrains Mono",monospace;opacity:.75}
.eyebrow{font-size:24px;color:var(--rose)}
.dark .eyebrow{color:var(--pink)}
h1{font-family:"Cormorant Garamond",serif;font-weight:500;line-height:.98;letter-spacing:-.01em}
img{display:block}
.fill{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.glow{position:absolute;border-radius:50%;filter:blur(90px);opacity:.55}
</style></head><body>
<div id="stage"></div>
<script>
const R = '../../../v2-bracelet/renders/';

p6: `<div class="post p45 dark">

// ---- story ads, 1080x1920 ----
adA: `<div class="post p916 dark">

const id = location.hash.slice(1);
document.getElementById('stage').innerHTML = P[id] || '';
window.IDS = Object.keys(P);
</script></body></html>
